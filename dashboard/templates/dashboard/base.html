<!DOCTYPE html>
<html lang="ru" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {% block title %}
    {% endblock %}

    {% load static %}
    <link href="{% static 'dashboard/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'dashboard/css/sticky-footer-navbar.css' %}" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body class="d-flex flex-column h-100">

<div class="container">
    <header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">
        <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
            <li><a href="{% url 'dashboard:index' %}" class="nav-link px-2 link-secondary">Главная</a></li>
        </ul>

        <div class="col-md-3 text-end">
            {% if user.is_authenticated %}
                <span class="me-2">{{ user.email|default:user.username }}</span>
                <form method="post" action="{% url 'user:logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-primary">Выход</button>
                </form>
            {% else %}
                <a href="{% url 'user:auth' %}" class="btn btn-primary">Войти</a>
            {% endif %}
        </div>
    </header>
</div>

<main class="flex-shrink-0">
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</main>

<footer class="footer mt-auto py-3 bg-light">
    <div class="container">
        <ul class="nav justify-content-center border-bottom pb-3 mb-3">
            <li class="nav-item"><a href="{% url 'dashboard:index' %}" class="nav-link px-2 text-muted">Главная</a></li>
        </ul>
        <p class="text-center text-muted">Investing</p>
    </div>
</footer>

</body>
</html>
